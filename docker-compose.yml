services:
  backend:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: C:/Users/dell/finops-dashboard
    volumes:
      - C:/Users/dell/finops-dashboard:/app
    ports:
      - "3000:3000"
    command: npm start




